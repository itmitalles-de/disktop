name: CI

on:
  # Pull requests are tested once through pull_request; pushes only for main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run so new advisories surface without a code change; only the audit job runs.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
      - name: Test minimum supported Rust
        run: cargo +1.88.0 test --locked
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Test terminal restoration
        run: python3 tests/terminal.py target/release/dwtop
      - name: Test Setup and saved preferences
        run: python3 tests/setup.py target/release/dwtop
      - name: Build isolated test environment
        run: docker build --tag dwtop-test tests
      - name: Test real per-process and device storage I/O
        run: >-
          docker run --rm --network none --volume "$PWD:/work:ro"
          dwtop-test python3 tests/live_io.py --isolated target/release/dwtop
      - name: Test unprivileged UI and capability helper
        run: >-
          docker run --rm --network none --cap-add DAC_READ_SEARCH --cap-add SYS_PTRACE
          --volume "$PWD:/work:ro" dwtop-test
          python3 tests/helper.py --isolated target/release/dwtop target/release/dwtop-collector
      - name: Check installer scripts
        run: shellcheck scripts/*.sh
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit
