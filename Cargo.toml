[package]
name = "disktop"
version = "0.1.0"
edition = "2024"
default-run = "disktop"
rust-version = "1.88"
description = "An nvtop-inspired Linux disk monitor with I/O graphs, per-process I/O, filesystems and a /home size view"
license = "GPL-3.0-or-later"
repository = "https://github.com/itmitalles-de/disktop"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
unicode-width = "0.2"

[[bin]]
name = "disktop"
path = "src/main.rs"

[[bin]]
name = "disktop-collector"
path = "src/bin/disktop-collector.rs"

[profile.release]
lto = "thin"
strip = true
