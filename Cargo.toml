[package]
name = "spctop"
version = "0.1.0"
edition = "2024"
default-run = "spctop"
rust-version = "1.88"
description = "A Linux storage-space monitor with used-space history, directory growth and a separate I/O view"
license = "GPL-3.0-or-later"
repository = "https://github.com/itmitalles-de/spctop"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
unicode-width = "0.2"

[[bin]]
name = "spctop"
path = "src/main.rs"

[[bin]]
name = "spctop-collector"
path = "src/bin/spctop-collector.rs"

[profile.release]
lto = "thin"
strip = true
